name: Build

on:
  push:
    branches: [ main ]
    tags: [ '[0-9]*-*' ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' && secrets.SIGNING_STORE_PASSWORD != '' && secrets.SIGNING_KEY_ALIAS != '' && secrets.SIGNING_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK and accept licenses
        run: |
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -n1)
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          SDK_EXIT=${PIPESTATUS[1]}
          set -o pipefail
          exit "$SDK_EXIT"

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate release tag and signing secrets
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "$HAS_SIGNING_KEY" != "true" ]; then
            echo "::error::Tag release requires SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, and SIGNING_KEY_PASSWORD secrets."
            exit 1
          fi
          VC=$(sed -n 's/.*versionCode *= *\([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
          VN=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          EXPECTED_TAG="${VC}-${VN}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' must match '<versionCode>-<versionName>' ('${EXPECTED_TAG}') for LSPosed Module Repo."
            exit 1
          fi

      - name: Decode signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > release.jks
          echo "MF2C_STORE_FILE=release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests and build release APK
        env:
          MF2C_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          MF2C_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          MF2C_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk MixFlip2Cover-release.apk

      - name: Remove temporary signing key
        if: always() && env.HAS_SIGNING_KEY == 'true'
        run: rm -f release.jks

      - name: Verify production APK signature on tag release
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING_KEY == 'true'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          CERT_INFO=$("$APKSIGNER" verify --min-sdk-version 24 --verbose --print-certs MixFlip2Cover-release.apk)
          echo "$CERT_INFO"
          if grep -q "CN=Android Debug" <<< "$CERT_INFO"; then
            echo "::error::Refusing to publish debug-signed APK on tag release."
            exit 1
          fi
          if ! grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" <<< "$CERT_INFO"; then
            echo "::error::APK Signature Scheme v2 verification failed."
            exit 1
          fi
          if ! grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" <<< "$CERT_INFO"; then
            echo "::error::APK Signature Scheme v3 verification failed."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MixFlip2Cover-${{ github.sha }}
          path: MixFlip2Cover-release.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: MixFlip2Cover-release.apk
          generate_release_notes: true
